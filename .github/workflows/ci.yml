name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Compile TypeScript
        run: yarn compile

      - name: Lint
        run: yarn lint

  test:
    name: Extension Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      # Reuse the downloaded VS Code build between runs (see .vscode-test.mjs).
      - name: Cache VS Code test download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install virtual display and VS Code libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libxss1 libxtst6 || true
          sudo apt-get install -y libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 \
            || sudo apt-get install -y libatk-bridge2.0-0 libgtk-3-0 libasound2

      - name: Run extension tests
        run: xvfb-run -a yarn test

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .vscode-test/**/logs/**
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Package extension
        run: yarn package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-inspector-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
