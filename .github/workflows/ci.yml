name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        shell: bash
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Compile TypeScript
        run: yarn compile

      - name: Lint
        run: yarn lint

  test:
    name: Extension Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        shell: bash
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      # Reuse the downloaded VS Code build between runs (see .vscode-test.mjs).
      - name: Cache VS Code test download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('.vscode-test.mjs') }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Install virtual display and VS Code libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libgbm1 libxss1 libxtst6 || true
          sudo apt-get install -y libatk-bridge2.0-0t64 libgtk-3-0t64 libasound2t64 \
            || sudo apt-get install -y libatk-bridge2.0-0 libgtk-3-0 libasound2

      - name: Run extension tests
        run: xvfb-run -a yarn test

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs
          path: .vscode-test/**/logs/**
          if-no-files-found: ignore
          retention-days: 7

  web-test:
    name: Web Extension (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        shell: bash
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Install Chromium for the web test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium

      - name: Run web extension tests
        run: xvfb-run -a yarn test:web

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        shell: bash
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Package extension
        run: yarn package

      - name: Verify package contents
        run: |
          yarn --silent vsce ls > vsix-files.txt
          if grep -Eq '^(src|\.github|\.vscode)/|^(node_modules|out/test)/|^(patch-sdk\.js|\.commitlintrc\.json|CONTRIBUTING\.md|\.nvmrc)$' vsix-files.txt; then
            echo "Unexpected files in the VSIX:"
            grep -E '^(src|\.github|\.vscode)/|^(node_modules|out/test)/|^(patch-sdk\.js|\.commitlintrc\.json|CONTRIBUTING\.md|\.nvmrc)$' vsix-files.txt
            exit 1
          fi
          echo "VSIX contents look clean"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-inspector-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
