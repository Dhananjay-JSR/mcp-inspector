name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v0.0.4)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.TAG.replace(/^v/, '');
            if (tag !== pkg.version) {
              console.error(\`Tag \${process.env.TAG} does not match package.json version \${pkg.version}\`);
              process.exit(1);
            }
            console.log(\`Releasing \${pkg.name} \${pkg.version}\`);
          "
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Package extension
        run: yarn package

      - name: Publish to VS Code Marketplace
        if: ${{ secrets.VSCE_PAT != '' }}
        run: yarn vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        run: gh release create "$TAG" *.vsix --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
