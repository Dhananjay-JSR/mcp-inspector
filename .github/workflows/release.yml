name: Release

# Runs automatically after CI succeeds on main. A release is created only when
# commits since the last tag contain a fix/feat/BREAKING CHANGE; the version
# bump (patch/minor/major) is derived from the conventional commit messages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Required for Marketplace Trusted Publishing and build provenance (OIDC).
  id-token: write
  attestations: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Create release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set the VSCE_PUBLISH repository variable to "true" after creating
          # the Marketplace Trusted Publishing policy for this repository.
          VSCE_PUBLISH: ${{ vars.VSCE_PUBLISH }}
          # Optional PAT fallback during the transition away from global PATs.
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GIT_AUTHOR_NAME: Dhananjay-JSR
          GIT_AUTHOR_EMAIL: ajaysenday@gmail.com
          GIT_COMMITTER_NAME: Dhananjay-JSR
          GIT_COMMITTER_EMAIL: ajaysenday@gmail.com

      - name: Attest VSIX provenance
        if: ${{ hashFiles('dist/*.vsix') != '' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.vsix'
