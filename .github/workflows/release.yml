name: Release

# Runs automatically after CI succeeds on main. A release is created only when
# commits since the last tag contain a fix/feat/BREAKING CHANGE; the version
# bump (patch/minor/major) is derived from the conventional commit messages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          GIT_AUTHOR_NAME: Dhananjay-JSR
          GIT_AUTHOR_EMAIL: ajaysenday@gmail.com
          GIT_COMMITTER_NAME: Dhananjay-JSR
          GIT_COMMITTER_EMAIL: ajaysenday@gmail.com
