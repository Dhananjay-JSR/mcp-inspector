name: Conventional Commits

# Validates every commit that reaches main. Squash merges take their commit
# message from the PR title, which the PR Title workflow also validates.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Verify toolchain
        shell: bash
        run: |
          test "v$(cat .nvmrc)" = "$(node --version)"
          test "$(yarn --version | cut -d. -f1,2)" = "1.22"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Lint commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            FROM="origin/${BASE_REF}"
            TO="HEAD"
          else
            FROM="${BEFORE_SHA}"
            TO="${AFTER_SHA}"
            if [ -z "${FROM}" ] || [ "${FROM}" = "0000000000000000000000000000000000000000" ]; then
              FROM="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          echo "Checking commits in ${FROM}..${TO}"
          npx commitlint --from "${FROM}" --to "${TO}" --verbose
