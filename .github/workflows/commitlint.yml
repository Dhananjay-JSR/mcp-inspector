name: Conventional Commits

# Validates every commit that reaches main. Squash merges take their commit
# message from the PR title, which the PR Title workflow also validates.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            FROM="origin/${BASE_REF}"
            TO="HEAD"
          else
            FROM="${BEFORE_SHA}"
            TO="${AFTER_SHA}"
            if [ -z "${FROM}" ] || [ "${FROM}" = "0000000000000000000000000000000000000000" ]; then
              FROM="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          echo "Checking commits in ${FROM}..${TO}"
          npx commitlint --from "${FROM}" --to "${TO}" --verbose
